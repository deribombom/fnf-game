<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Beat Battle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;color:white;font-family:Arial}
#game{height:100%;display:flex;flex-direction:column;align-items:center}
h1{margin:25px 0 10px;font-size:38px}
#score{font-size:20px;margin-bottom:10px}
#screen{position:relative;width:100%;max-width:600px;height:55%;background:#202030;overflow:hidden}
.lane{position:absolute;bottom:20px;width:22%;height:60px;border:4px solid white;border-radius:15px;text-align:center;font-size:42px}
.n{position:absolute;font-size:45px;font-weight:bold}
#buttons{display:flex;width:100%;max-width:600px;gap:7px;padding:10px}
button{flex:1;height:100px;font-size:48px;border:3px solid white;border-radius:20px;background:#333;color:white}
button:active{background:white;color:black}
#start{font-size:25px;height:65px}
</style>
</head>
<body>
<div id="game">
<h1>BEAT BATTLE</h1>
<div id="score">SCORE 0 | COMBO 0 | MISS 0</div>
<div id="screen">
<div class="lane" style="left:2%">←</div>
<div class="lane" style="left:26%">↓</div>
<div class="lane" style="left:50%">↑</div>
<div class="lane" style="left:74%">→</div>
</div>
<button id="start">START GAME</button>
<div id="buttons">
<button>←</button><button>↓</button><button>↑</button><button>→</button>
</div>
</div>
<script>
const screen=document.getElementById("screen"),score=document.getElementById("score");
const btns=[...document.querySelectorAll("#buttons button")];
let notes=[],playing=false,points=0,combo=0,miss=0;
const arrows=["←","↓","↑","→"];

function start(){
 playing=true;points=0;combo=0;miss=0;notes=[];
 document.getElementById("start").style.display="none";
 loop();
 setInterval(()=>spawn(),650);
}
function spawn(){
 if(!playing)return;
 let i=Math.floor(Math.random()*4);
 let n=document.createElement("div");
 n.className="n";n.textContent=arrows[i];n.dataset.i=i;
 n.style.left=(5+i*24)+"%";n.style.top="-50px";
 screen.appendChild(n);notes.push({el:n,i,hit:false});
}
function hit(i){
 if(!playing)return;
 let best=null,dist=999;
 notes.forEach(n=>{
  if(!n.hit&&n.i===i){
   let r=n.el.getBoundingClientRect(),s=screen.getBoundingClientRect();
   let d=Math.abs((r.top-s.top)-s.height*.82);
   if(d<dist){dist=d;best=n}
  }
 });
 if(best&&dist<100){
  best.hit=true;best.el.remove();points+=100+combo*10;combo++;
 }else{combo=0;miss++}
 score.textContent=`SCORE ${points} | COMBO ${combo} | MISS ${miss}`;
}
function loop(){
 if(!playing)return;
 notes.forEach(n=>{
  if(!n.hit){
   let y=parseFloat(n.el.style.top)+7;
   n.el.style.top=y+"px";
   if(y>screen.clientHeight){n.hit=true;n.el.remove();combo=0;miss++}
  }
 });
 score.textContent=`SCORE ${points} | COMBO ${combo} | MISS ${miss}`;
 requestAnimationFrame(loop);
}
btns.forEach((b,i)=>b.onclick=()=>hit(i));
document.getElementById("start").onclick=start;
</script>
</body>
</html>
